name: Build SCSR2043 study PDF

on:
  push:
    branches:
      - study-guides/scsr2043
    paths:
      - study-guides/build_os_guide.py
      - .github/workflows/build-scsr2043-pdf.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build PDF
        run: |
          python -m pip install --disable-pip-version-check reportlab
          python study-guides/build_os_guide.py
          test -s study-guides/SCSR2043_Operating_Systems_Introduction_Study_Guide.pdf
      - name: Commit downloadable PDF to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add study-guides/SCSR2043_Operating_Systems_Introduction_Study_Guide.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build downloadable SCSR2043 study guide PDF"
            git push origin HEAD:study-guides/scsr2043
          fi
